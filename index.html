<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base de datos · Artistas contemporáneos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f7f7f5;
    --ink: #1e1e1c;
    --ink-soft: #6b6b66;
    --line: #e4e4e0;
    --accent: #5a7a3a;
    --accent-soft: #eef2e8;
    --warn: #a05a2c;
    --warn-soft: #f6ede4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Fira Code', monospace;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header h1::before { content: "◳ "; color: var(--accent); }
  header p { color: var(--ink-soft); font-size: 12px; margin-top: 4px; }
  header nav { margin-top: 8px; font-size: 12px; display: flex; gap: 14px; }
  header nav a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  header nav a:hover { border-bottom-color: var(--accent); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-alt);
    position: sticky; top: 0; z-index: 5;
  }
  #buscar {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--ink);
    flex: 1 1 260px;
    min-width: 200px;
  }
  #buscar:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  select {
    font-family: inherit;
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #contador { font-size: 12px; color: var(--ink-soft); margin-left: auto; white-space: nowrap; }
  #contador b { color: var(--accent); font-weight: 600; }

  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    padding: 10px 14px;
    border-bottom: 2px solid var(--line);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    background: var(--bg);
  }
  th:hover { color: var(--accent); }
  th .flecha { color: var(--accent); margin-left: 3px; }
  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tr.fila { cursor: pointer; }
  tr.fila:hover td { background: var(--accent-soft); }
  td.nombre { font-weight: 500; white-space: nowrap; }
  td.num { color: var(--ink-soft); font-size: 11px; }
  .chip {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    background: var(--bg-alt);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    margin: 1px 3px 1px 0;
    white-space: nowrap;
  }
  .chip.multi { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .estado-pendiente { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
  .estado-verificado,
  [class*="estado-factual"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .vacio { color: #c4c4bf; }
  a.consulta {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 3px;
    border: 1px solid var(--accent);
    color: var(--accent);
    background: var(--bg);
    text-decoration: none;
    margin: 1px 3px 1px 0;
    white-space: nowrap;
  }
  a.consulta:hover { background: var(--accent); color: #fff; }
  a.consulta.principal { background: var(--accent-soft); font-weight: 600; }

  tr.detalle td {
    background: var(--bg-alt);
    padding: 14px 24px;
    font-size: 12px;
  }
  .detalle-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 16px; max-width: 860px; }
  .detalle-grid dt { color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 1px; }
  .detalle-grid dd a { color: var(--accent); word-break: break-all; }
  .sin-dato { color: #b8b8b2; font-style: italic; }

  #vacio-msg { padding: 40px 24px; color: var(--ink-soft); display: none; }
  footer { padding: 18px 24px; color: var(--ink-soft); font-size: 11px; border-top: 1px solid var(--line); }
  @media (max-width: 640px) {
    .col-opcional { display: none; }
    header { padding: 20px 16px 14px; }
    .controls { padding: 12px 16px; }
    td, th { padding: 8px 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>Artistas contemporáneos</h1>
  <p>Base de consulta · fuentes: Vitamin P (1–3), ArtReview Top 100, Frieze 25, base propia</p>
  <nav>
    <a href="fuentes.html">Fuentes ↗</a>
    <a href="corridas.html">Corridas ↗</a>
  </nav>
</header>

<div class="controls">
  <input type="text" id="buscar" placeholder="Buscar nombre, tema, medio, lugar…" autocomplete="off">
  <select id="f-fuente"><option value="">Fuente: todas</option></select>
  <select id="f-medio"><option value="">Medio: todos</option></select>
  <select id="f-tema"><option value="">Tema: todos</option></select>
  <select id="f-estado"><option value="">Estado: todos</option></select>
  <span id="contador"></span>
</div>

<div class="tabla-wrap">
  <table>
    <thead>
      <tr>
        <th data-col="id">#</th>
        <th data-col="nombre">Nombre</th>
        <th data-col="fecha_nacimiento" class="col-opcional">Nacimiento</th>
        <th data-col="edad" class="col-opcional">Edad</th>
        <th data-col="lugar_nacimiento">Lugar de nacimiento</th>
        <th data-col="residencia" class="col-opcional">Residencia</th>
        <th data-col="fuentes">Fuentes</th>
        <th data-col="estado_verificacion" class="col-opcional">Estado</th>
        <th>Consultar</th>
      </tr>
    </thead>
    <tbody id="cuerpo"></tbody>
  </table>
  <div id="vacio-msg">Sin resultados para esta combinación de búsqueda y filtros.</div>
</div>

<footer id="pie"></footer>

// ---------- parser CSV (maneja comillas y comas internas) ----------
// ---------- estado ----------
let cabecera = [], registros = [];
let orden = { col: 'id', asc: true };

function cargarDatos(filas) {
  cabecera = filas[0];
  registros = filas.slice(1).map(f => {
    const r = {};
    cabecera.forEach((h, i) => r[h] = (f[i] || '').trim());
    r.edad = /fallecid/.test(r.hitos || '') ? '†' : calcularEdad(r.fecha_nacimiento);
    return r;
  });
  poblarFiltros();
  render();
}

function calcularEdad(fecha) {
  if (!fecha) return '';
  const m = fecha.match(/^(\d{4})(?:-(\d{2})-(\d{2}))?/);
  if (!m) return '';
  const hoy = new Date();
  let edad = hoy.getFullYear() - parseInt(m[1]);
  if (m[2]) {
    const cumple = new Date(hoy.getFullYear(), parseInt(m[2]) - 1, parseInt(m[3]));
    if (hoy < cumple) edad--;
  }
  return String(edad);
}

// ---------- filtros dinámicos ----------
function poblarFiltros() {
  const setF = new Set(), setM = new Set(), setT = new Set(), setE = new Set();
  registros.forEach(r => {
    (r.fuentes || '').split('|').forEach(x => x.trim() && setF.add(x.trim()));
    (r.medios || '').split(';').forEach(x => x.trim() && setM.add(x.trim()));
    (r.temas || '').split(';').forEach(x => x.trim() && setT.add(x.trim()));
    if (r.estado_verificacion) setE.add(r.estado_verificacion.trim());
  });
  llenarSelect('f-fuente', setF); llenarSelect('f-medio', setM);
  llenarSelect('f-tema', setT); llenarSelect('f-estado', setE);
  // ocultar filtros aún sin datos
  document.getElementById('f-medio').style.display = setM.size ? '' : 'none';
  document.getElementById('f-tema').style.display = setT.size ? '' : 'none';
}
function llenarSelect(id, valores) {
  const sel = document.getElementById(id);
  const actual = sel.value;
  sel.length = 1;
  [...valores].sort((a,b) => a.localeCompare(b, 'es')).forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
  });
  sel.value = [...valores].includes(actual) ? actual : '';
}

// ---------- normalización para búsqueda sin tildes ----------
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// ---------- render ----------
function filtrar() {
  const q = norm(document.getElementById('buscar').value);
  const fF = document.getElementById('f-fuente').value;
  const fM = document.getElementById('f-medio').value;
  const fT = document.getElementById('f-tema').value;
  const fE = document.getElementById('f-estado').value;
  return registros.filter(r => {
    if (fF && !(r.fuentes || '').split('|').map(x => x.trim()).includes(fF)) return false;
    if (fM && !(r.medios || '').split(';').map(x => x.trim()).includes(fM)) return false;
    if (fT && !(r.temas || '').split(';').map(x => x.trim()).includes(fT)) return false;
    if (fE && r.estado_verificacion.trim() !== fE) return false;
    if (q) {
      const pajar = norm([r.nombre, r.lugar_nacimiento, r.residencia, r.temas, r.medios, r.hitos, r.fuentes].join(' '));
      if (!pajar.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const lista = filtrar();
  lista.sort((a, b) => {
    let va = a[orden.col] || '', vb = b[orden.col] || '';
    if (orden.col === 'id' || orden.col === 'edad') { va = parseInt(va) || 0; vb = parseInt(vb) || 0; }
    const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'es');
    return orden.asc ? cmp : -cmp;
  });

  const cuerpo = document.getElementById('cuerpo');
  cuerpo.innerHTML = '';
  const frag = document.createDocumentFragment();
  lista.forEach(r => {
    const tr = document.createElement('tr');
    tr.className = 'fila';
    tr.dataset.id = r.id;
    const fuentes = (r.fuentes || '').split('|').map(x => x.trim()).filter(Boolean);
    const chipCls = fuentes.length > 1 ? 'chip multi' : 'chip';
    tr.innerHTML =
      `<td class="num">${r.id}</td>` +
      `<td class="nombre">${esc(r.nombre)}</td>` +
      `<td class="col-opcional">${r.fecha_nacimiento ? esc(r.fecha_nacimiento) : '<span class="vacio">·</span>'}</td>` +
      `<td class="col-opcional">${r.edad || '<span class="vacio">·</span>'}</td>` +
      `<td>${r.lugar_nacimiento ? esc(r.lugar_nacimiento) : '<span class="vacio">·</span>'}</td>` +
      `<td class="col-opcional">${r.residencia ? esc(r.residencia) : '<span class="vacio">·</span>'}</td>` +
      `<td>${fuentes.map(f => `<span class="${chipCls}">${esc(f)}</span>`).join('')}</td>` +
      `<td class="col-opcional"><span class="chip estado-${esc(r.estado_verificacion || 'pendiente')}">${esc(r.estado_verificacion || 'pendiente')}</span></td>` +
      `<td onclick="event.stopPropagation()">${linksConsulta(r, true)}</td>`;
    tr.addEventListener('click', () => toggleDetalle(tr, r));
    frag.appendChild(tr);
  });
  cuerpo.appendChild(frag);
  document.getElementById('vacio-msg').style.display = lista.length ? 'none' : 'block';
  document.getElementById('contador').innerHTML = `<b>${lista.length}</b> / ${registros.length}`;
  const verificados = registros.filter(r => /^(verificado|factual)/.test(r.estado_verificacion)).length;
  document.getElementById('pie').textContent =
    `${registros.length} artistas · ${verificados} verificados · edad calculada a partir de la fecha de nacimiento · clic en una fila para ver la ficha completa`;
  // flechas de orden
  document.querySelectorAll('th').forEach(th => {
    const f = th.querySelector('.flecha'); if (f) f.remove();
    if (th.dataset.col === orden.col) {
      const s = document.createElement('span'); s.className = 'flecha';
      s.textContent = orden.asc ? '↑' : '↓'; th.appendChild(s);
    }
  });
}

function toggleDetalle(tr, r) {
  const sig = tr.nextElementSibling;
  if (sig && sig.classList.contains('detalle')) { sig.remove(); return; }
  document.querySelectorAll('tr.detalle').forEach(x => x.remove());
  const det = document.createElement('tr');
  det.className = 'detalle';
  const campos = [
    ['Temas', r.temas], ['Medios', r.medios], ['Hitos', r.hitos],
    ['Consultar', linksConsulta(r, false)], ['Fuentes', r.fuentes]
  ];
  det.innerHTML = `<td colspan="9"><dl class="detalle-grid">` +
    campos.map(([k, v]) =>
      `<dt>${k}</dt><dd>${v || '<span class="sin-dato">pendiente</span>'}</dd>`).join('') +
    `</dl></td>`;
  tr.after(det);
}

function linksConsulta(r, compacto) {
  const q = encodeURIComponent(r.nombre);
  const out = [];
  if (r.enlace_existente)
    out.push(`<a class="consulta principal" href="${esc(r.enlace_existente)}" target="_blank" rel="noopener">galería</a>`);
  out.push(`<a class="consulta" href="https://es.wikipedia.org/w/index.php?search=${q}" target="_blank" rel="noopener">wiki-es</a>`);
  out.push(`<a class="consulta" href="https://en.wikipedia.org/w/index.php?search=${q}" target="_blank" rel="noopener">wiki-en</a>`);
  out.push(`<a class="consulta" href="https://www.artsy.net/search?term=${q}" target="_blank" rel="noopener">artsy</a>`);
  if (!compacto) {
    out.push(`<a class="consulta" href="https://www.google.com/search?q=${q}+artist" target="_blank" rel="noopener">google</a>`);
    out.push(`<a class="consulta" href="https://www.google.com/search?q=${q}+artist&tbm=isch" target="_blank" rel="noopener">imágenes</a>`);
    out.push(`<a class="consulta" href="https://www.moma.org/search/?query=${q}" target="_blank" rel="noopener">moma</a>`);
    out.push(`<a class="consulta" href="https://www.tate.org.uk/search?q=${q}" target="_blank" rel="noopener">tate</a>`);
  }
  const extras = (r.enlaces || '').split(';').map(x => x.trim()).filter(Boolean);
  extras.forEach(u => out.push(`<a class="consulta principal" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0])}</a>`));
  return out.join('');
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- eventos ----------
['buscar','f-fuente','f-medio','f-tema','f-estado'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));
document.querySelectorAll('th').forEach(th =>
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (orden.col === col) orden.asc = !orden.asc;
    else { orden.col = col; orden.asc = true; }
    render();
  }));
// ---------- arranque ----------
cargarDatos(DATOS_CSV);
</script>
